<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Fly</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;font-family:Arial,sans-serif}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#07143a,#102b57 55%,#07111f)}
#stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#8be9ff 1px,transparent 1px);background-size:55px 55px,91px 91px;opacity:.65}
#player{position:absolute;left:70px;top:250px;width:52px;height:32px;border:3px solid #7df9ff;border-radius:50% 55% 45% 50%;background:linear-gradient(135deg,#e9ffff,#48d9ff 45%,#5146ff);box-shadow:0 0 14px #39eaff,0 0 30px #5146ff;z-index:5;transform:rotate(-5deg)}
#player:before{content:"";position:absolute;width:15px;height:8px;left:8px;top:8px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff}
#player:after{content:"";position:absolute;right:-22px;top:9px;width:24px;height:12px;background:linear-gradient(90deg,#ff5df7,#ffb300,transparent);clip-path:polygon(0 20%,100% 50%,0 80%);filter:drop-shadow(0 0 7px #ff5df7)}
.pipe{position:absolute;width:62px;background:linear-gradient(90deg,#6b2cff,#18d9ff,#6b2cff);border:3px solid #a8ffff;box-shadow:0 0 16px #24dfff;z-index:3}
.pipe.top{top:0}.pipe.bottom{bottom:0}
#score{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:48px;font-weight:900;color:#fff;text-shadow:0 0 10px #20eaff;z-index:10}
#highscore{position:absolute;top:20px;right:20px;font-size:20px;font-weight:700;color:#7df9ff;text-shadow:0 0 8px #00eaff;z-index:10}

/* Instagram Button Style */
#insta-btn{position:absolute;top:18px;left:20px;z-index:15;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);box-shadow:0 0 12px rgba(220, 39, 67, 0.6);text-decoration:none;transition:transform 0.2s ease}
#insta-btn:hover{transform:scale(1.1)}
#insta-btn svg{width:24px;height:24px;fill:#ffffff}

#message{position:absolute;z-index:20;top:38%;width:100%;text-align:center;color:white;font-weight:900;font-size:30px;text-shadow:0 0 12px #00eaff}
#message small{font-size:18px}
button{margin-top:16px;padding:13px 30px;border:2px solid #7df9ff;border-radius:14px;background:#101a42;color:#fff;font-size:18px;font-weight:bold;box-shadow:0 0 18px #00d9ff;cursor:pointer}
.hint{font-size:14px;margin-top:12px;opacity:.8}
</style>
</head>
<body>
<div id="game">
<div id="stars"></div>

<!-- Instagram Icon Button -->
<a id="insta-btn" href="https://instagram.com/zaiddduu___" target="_blank" rel="noopener noreferrer" title="Follow on Instagram">
  <svg viewBox="0 0 24 24">
    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
  </svg>
</a>

<div id="score">0</div>
<div id="highscore">BEST: 0</div>
<div id="player"></div>
<div id="message">NEON FLY<br><button id="start">START GAME</button><div class="hint">Tap the screen to fly</div></div>
</div>
<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const highScoreEl=document.getElementById("highscore");
const message=document.getElementById("message");
const startBtn=document.getElementById("start");

let y=250,vy=0,score=0,pipes=[],running=false,ended=false,last=0;
let highScore=localStorage.getItem("neon_fly_highscore") || 0;
highScoreEl.textContent = "BEST: " + highScore;

let gameSpeed = 3.2; 
const gravity=.24, jump=-5.4;

function startGame(){
  pipes.forEach(p=>{p.t.remove();p.b.remove()});
  pipes=[]; y=game.clientHeight*.42; vy=0; score=0; scoreEl.textContent="0";
  running=true;ended=false;message.style.display="none";last=performance.now();
  gameSpeed = 3.2; 
  requestAnimationFrame(loop);
}

function fly(){
  if(!running)return;
  vy=jump;
}

function makePipe(){
  const gap=210,h=game.clientHeight;
  const minTop=50;
  const maxTop=Math.max(minTop, Math.floor(h * 0.45)); 
  const topH=Math.floor(Math.random()*(maxTop-minTop))+minTop;
  const bottomH=h-topH-gap;
  const t=document.createElement("div"),b=document.createElement("div");
  t.className="pipe top";b.className="pipe bottom";
  t.style.height=topH+"px";b.style.height=bottomH+"px";
  game.appendChild(t);game.appendChild(b);
  pipes.push({t,b,x:game.clientWidth+20,scored:false});
}

function hit(a,b){
  return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
}

function endGame(){
  if(ended)return;
  ended=true;running=false;

  if(score > highScore){
    highScore = score;
    localStorage.setItem("neon_fly_highscore", highScore);
    highScoreEl.textContent = "BEST: " + highScore;
  }

  message.innerHTML="GAME OVER<br><small>Score: "+score+" | Best: "+highScore+"</small><br><button id=\"again\">PLAY AGAIN</button>";
  message.style.display="block";
  document.getElementById("again").onclick=startGame;
}

function loop(now){
  if(!running)return;
  vy+=gravity;y+=vy;
  player.style.top=y+"px";
  player.style.transform=`rotate(${Math.max(-18,Math.min(22,vy*2))}deg)`;

  if(now-last>2200){makePipe();last=now}

  const pr=player.getBoundingClientRect();
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];
    p.x -= gameSpeed;
    p.t.style.left=p.x+"px";p.b.style.left=p.x+"px";

    if(hit(pr,p.t.getBoundingClientRect())||hit(pr,p.b.getBoundingClientRect())){endGame();return}
    if(!p.scored&&p.x+62<70){
      p.scored=true;
      score++;
      scoreEl.textContent=score;
      // Ab speed har point ke sath bahut dheere-dhire badhegi (0.02)
      gameSpeed += 0.02; 
    }
    if(p.x<-80){p.t.remove();p.b.remove();pipes.splice(i,1)}
  }

  if(y<0||y+32>game.clientHeight){endGame();return}
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click",e=>{e.stopPropagation();startGame()});
game.addEventListener("pointerdown",e=>{
  if(e.target.tagName==="BUTTON" || e.target.closest("#insta-btn"))return;
  if(running)fly();
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(running){
      fly();
    } else {
      startGame();
    }
  }
});
</script>
</body>
</html>
